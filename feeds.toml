[feeds.aisi-blog]
feed_title = "AISI Blog (AI Security Institute)"
feed_description = "Updates on AISI's work - AI Security Institute"
source_url = "https://www.aisi.gov.uk/blog"
item_container_selector = "div.work-card-wrapper"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h3::text"
item_date_selector = "p[fs-list-field='date']::text"
item_description_selector = "p[fs-list-field='description']::text"

[feeds.allenai-news]
feed_title = "Ai2 News (Allen Institute for AI)"
source_url = "https://allenai.org/news"
item_container_selector = "div[class*='grid-tr_subgrid']"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h2::text"
item_date_selector = "h2 span:first-child::text"
item_description_selector = "div > p::text"

[feeds.anthropic-news]
feed_title = "Anthropic News"
source_url = "https://www.anthropic.com/news"
format = "json"
item_container_selector = ".. | objects | select(._type == \"post\" or ._type == \"featuredGridLink\")"
item_title_selector = ".title"
item_link_selector = ".url // .slug.current"
item_date_selector = ".date // .publishedOn"
item_description_selector = ".summary"

[feeds.anthropic-research]
feed_title = "Anthropic Research"
source_url = "https://www.anthropic.com/research"
format = "json"
item_container_selector = ".. | objects | select(._type == \"post\" or ._type == \"featuredGridLink\")"
item_title_selector = ".title"
item_link_selector = ".url // .slug.current"
item_date_selector = ".date // .publishedOn"
item_description_selector = ".summary"

[feeds.claude-blog]
feed_title = "Claude Blog"
source_url = "https://claude.com/blog"
item_container_selector = "div.marquee_cms_blog_list_item"
item_title_selector = "h2::text"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_date_selector = "div.u-text-style-caption::text"

[feeds.turing-blog]
feed_title = "Turing Blog (Alan Turing Institute)"
source_url = "https://www.turing.ac.uk/blog"
item_container_selector = "article.node--type-article"
item_title_selector = "h3 a[href^='/blog/'] span::text"
item_link_selector = "h3 a[href^='/blog/']::attr(href)"
item_date_selector = "div.field-published-date span::text"

[feeds.turing-news]
feed_title = "Turing News (Alan Turing Institute)"
source_url = "https://www.turing.ac.uk/news"
item_container_selector = "article.node--type-article"
item_title_selector = "h3 a[href^='/news/'] span::text"
item_link_selector = "h3 a[href^='/news/']::attr(href)"
item_date_selector = "div.field-published-date span::text"

[feeds.mila-news]
feed_title = "Mila News (Quebec AI Institute)"
feed_description = "News and announcements from Mila - Quebec AI Institute."
source_url = "https://mila.quebec/en/news"
item_container_selector = "#news-listing .node--type-news"
item_title_selector = "div.field-name-node-title a::text"
item_link_selector = "div.field-name-node-title a::attr(href)"
item_date_selector = "div.field-name-dynamic-twig-fieldnode-default-date-format-wrapped span::text"

[feeds.the-batch]
broken = true
feed_title = "The Batch"
feed_description = "Weekly AI news for engineers, executives, and enthusiasts."
source_url = "https://www.deeplearning.ai/the-batch"
format = "json"
item_container_selector = ".props.pageProps.posts[]"
item_link_selector = ".slug"
item_title_selector = ".title"
item_date_selector = ".published_at"
item_description_selector = ".custom_excerpt // .excerpt"

[feeds.tldr-ai]
feed_title = "TLDR AI"
source_url = "https://tldr.tech/ai/archives"
item_container_selector = "a[href^='/ai/20']"
item_link_selector = "::attr(href)"
item_title_selector = "div::text"
item_date_selector = "::attr(href)"
item_date_regex = "\\d{4}-\\d{2}-\\d{2}"

# Two overlapping JSON sources on the page: the Next.js Flight "posts" array
# has the full post history but no description, and excludes the pinned
# hero/call-for-input post entirely; the JSON-LD "blogPost" list only covers
# the 12 newest posts but includes the hero and has descriptions. The
# container selector unions both shapes; overlapping posts dedup by link,
# and JSON-LD's richer record wins ties (see _extract_json_items ordering).
[feeds.cosine-blog]
feed_title = "Cosine Blog"
feed_description = "Product updates, research notes, and practical writing about building production software with AI agents."
source_url = "https://cosine.sh/blog"
format = "json"
item_container_selector = ".. | objects | select(has(\"posts\") or has(\"blogPost\")) | (.posts // .blogPost)[]"
item_title_selector = ".title // .headline"
item_link_selector = ".href // .url"
item_date_selector = ".date // .datePublished"
item_description_selector = ".description"

[feeds.cohere-blog]
feed_title = "Cohere Blog"
feed_description = "Latest news and updates from Cohere."
source_url = "https://cohere.com/blog"
item_container_selector = "section#blog-browse-all li"
item_title_selector = "p.text-web3-20 ::text"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_date_selector = "span p:first-of-type ::text"

[feeds.mistral-news]
feed_title = "Mistral News"
feed_description = "Latest news and announcements from Mistral AI."
source_url = "https://mistral.ai/news/"
item_container_selector = "article.js-post"
item_title_selector = "h2 ::text"
item_link_selector = "a::attr(href)"
item_date_selector = "footer div:first-child p ::text"
item_description_selector = "h2 + p ::text"

# x.ai sits behind Cloudflare bot management which blocks Scrapy's TLS
# fingerprint; `impersonate` routes the fetch through curl_cffi.
# Page has three item layouts (hero, featured cards, "All posts" list); all
# share the `a[href^='/news/']` anchor. The hero repeats its title in h1 and
# h2, so the title selector deliberately skips h2 to avoid a doubled title.
[feeds.spacex-ai-news]
feed_title = "SpaceX AI News"
feed_description = "SpaceX AI News: Research, product & company updates."
source_url = "https://x.ai/news"
impersonate = "chrome"
item_container_selector = "a[href^='/news/']"
item_title_selector = "h1::text, h3::text"
item_link_selector = "::attr(href)"
item_date_selector = "div[class*='text-primary/40']::text"
item_description_selector = "p::text"

# cetas.turing.ac.uk sits behind a Cloudflare managed challenge that blocks
# plain Scrapy requests; `impersonate` routes the fetch through curl_cffi.
# Listing pages are paginated (page 2+ via ?page=... AJAX query) with no
# embedded JSON of the item list (just Drupal settings), so per the
# no-follow-links rule this only covers the first page (9 items). There's
# no dedicated date field; the publication date is parsed out of the
# citation text, e.g. "... CETaS Policy Briefs (July 2026)."
[feeds.cetas-research]
feed_title = "CETaS Research"
feed_description = "CETaS research on emerging technology and security issues."
source_url = "https://cetas.turing.ac.uk/research-and-analysis/research"
impersonate = "chrome"
item_container_selector = "article.node--type-research-publications"
item_title_selector = "h3 span.field--title::text"
item_link_selector = "h3 a::attr(href)"
item_date_selector = ".field-criteria p ::text"
item_date_regex = "[A-Za-z]+ \\d{4}"
item_description_selector = ".field-criteria p ::text"

[feeds.cetas-analysis]
feed_title = "CETaS Analysis"
feed_description = "Analysis and commentary from leading experts across our network."
source_url = "https://cetas.turing.ac.uk/research-and-analysis/analysis"
impersonate = "chrome"
item_container_selector = "article.node--type-research-publications"
item_title_selector = "h3 span.field--title::text"
item_link_selector = "h3 a::attr(href)"
item_date_selector = ".field-criteria p ::text"
item_date_regex = "[A-Za-z]+ \\d{4}"
item_description_selector = ".field-criteria p ::text"
